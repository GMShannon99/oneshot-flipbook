<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sticks &amp; Stones</title>

<meta property="og:type" content="website">
<meta property="og:url" content="https://gmshannon99.github.io/oneshot-flipbook/">
<meta property="og:title" content="&quot;Sticks &amp; Stones&quot; by Jessie Grill">
<meta property="og:description" content="A page-flip viewer for the illustrated book Sticks &amp; Stones — click, drag, or use the arrow keys to turn pages.">
<meta property="og:image" content="https://gmshannon99.github.io/oneshot-flipbook/images/page-01.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="&quot;Sticks &amp; Stones&quot; by Jessie Grill">
<meta name="twitter:description" content="A page-flip viewer for the illustrated book Sticks &amp; Stones — click, drag, or use the arrow keys to turn pages.">
<meta name="twitter:image" content="https://gmshannon99.github.io/oneshot-flipbook/images/page-01.png">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="title">Sticks &amp; Stones</span>
      <span id="page-indicator">&nbsp;</span>
    </header>

    <main id="stage">
      <div id="book"></div>
      <button id="prev-btn" class="nav-btn" aria-label="Previous page">&#8249;</button>
      <button id="next-btn" class="nav-btn" aria-label="Next page">&#8250;</button>
    </main>

    <div id="loading">
      <div class="spinner"></div>
      <div>Loading book&hellip;</div>
    </div>

    <footer id="hint">Click / drag a page corner &middot; Use &larr; &rarr; keys</footer>
  </div>

  <script src="vendor/page-flip.browser.js"></script>
  <script src="script.js"></script>
</body>
</html>
